name: Agent evaluation

# Run the end-to-end evaluation on GitHub instead of a laptop: Actions -> Agent evaluation ->
# Run workflow. Needs the repository secret GROQ_API_KEY (LANGSMITH_API_KEY is optional).
on:
  workflow_dispatch:
    inputs:
      model:
        description: Groq model
        type: choice
        options: [openai/gpt-oss-120b, openai/gpt-oss-20b]
        default: openai/gpt-oss-120b
      cases:
        description: Only these cases (comma-separated ids; empty = all)
        required: false
        default: ""
      commit:
        description: Commit the results to the repository (full runs only)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LLM_PROVIDER: groq
      LLM_MODEL: ${{ inputs.model }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      LANGSMITH_TRACING: "true" # only switched on when the secret below is set
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_ENDPOINT: ${{ vars.LANGSMITH_ENDPOINT }}
      CASES: ${{ inputs.cases }}
    steps:
      - name: Check the API key
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::error::Add GROQ_API_KEY under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Evaluate
        run: |
          if [ -n "$CASES" ]; then
            uv run python evals/run_agent_eval.py --only "$CASES"
          else
            uv run python evals/run_agent_eval.py
          fi
      - name: Keep the results
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            evals/results/
            README.md
      - name: Commit the results
        if: inputs.commit && inputs.cases == ''
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard evals/results)" ]; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md evals/results
          git commit -m "eval: results for $LLM_MODEL"
          git push
