[project]
name = "statline-agent"
version = "0.1.0"
description = "An AI data analyst agent for Dutch open data (CBS StatLine), built with LangGraph."
readme = "README.md"
license = "MIT"
authors = [{ name = "Munzur Atak" }]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.7",
    "langchain-groq>=1.1.3",
    "langchain-ollama>=1.1.0",
    "pydantic-settings>=2.16.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
