[project]
name = "statline-agent"
version = "0.1.0"
description = "An AI data analyst agent for Dutch open data (CBS StatLine), built with LangGraph."
readme = "README.md"
license = "MIT"
authors = [{ name = "Munzur Atak" }]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "langchain>=1.4.7",
    "langchain-groq>=1.1.3",
    "langchain-ollama>=1.1.0",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "pydantic-settings>=2.16.1",
    "rank-bm25>=0.2.2",
    "snowballstemmer>=3.1.1",
]

[project.scripts]
statline-agent = "statline_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[[tool.mypy.overrides]]
module = ["plotly.*", "rank_bm25", "snowballstemmer"]
ignore_missing_imports = true
